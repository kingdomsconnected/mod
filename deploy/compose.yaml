services:
  server:
    image: ${KCDC_IMAGE:-ghcr.io/kingdomsconnected/kcdc-server}:${KCDC_VERSION:?Set KCDC_VERSION to a released version}
    platform: linux/amd64
    restart: unless-stopped
    init: true
    ports:
      - "27015:27015/udp"
      - "27015:27015/tcp"
    volumes:
      - server-data:/home/container
    stop_grace_period: 30s

volumes:
  server-data:
